; ============================================================
;  Music Bar Visualizer — pilih environment = pilih board + display
;
;  Cara memilih : klik "Default (...)" di status bar bawah VS Code
;                 -> pilih salah satu env di bawah.
;  CLI          : pio run -e uno_lcd -t upload
;
;  Nama env     : <board>_<display>
;     board   : esp32 | uno
;     display : ssd1306 | ssd1305 | lcd
; ============================================================

[platformio]
; Env yang dipakai saat menekan Build/Upload tanpa memilih env.
; Ganti sesuai board + layar yang sedang kamu pakai.
default_envs = uno_ssd1305

; ---------------- Pengaturan dasar per board ----------------
[base_esp32]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain+

[base_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_unflags = -flto          ; hindari error "relocation truncated to fit"
lib_ldf_mode = chain+

; ======================== ESP32 ========================
[env:esp32_ssd1306]
extends = base_esp32
build_flags = -DDISPLAY_SSD1306
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:esp32_ssd1305]
extends = base_esp32
build_flags = -DDISPLAY_SSD1305
lib_deps =
    adafruit/Adafruit SSD1305
    ; jika tidak ada di registry: https://github.com/adafruit/Adafruit_SSD1305.git
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:esp32_lcd]
extends = base_esp32
build_flags = -DDISPLAY_LCD1602
lib_deps =
    duinowitchery/hd44780 @ ^1.3.2

; ======================== ARDUINO UNO ========================
[env:uno_ssd1306]
extends = base_uno
build_flags = -DDISPLAY_SSD1306
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:uno_ssd1305]
extends = base_uno
build_flags = -DDISPLAY_SSD1305
lib_deps =
    adafruit/Adafruit SSD1305
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:uno_lcd]
extends = base_uno
build_flags = -DDISPLAY_LCD1602
lib_deps =
    duinowitchery/hd44780 @ ^1.3.2